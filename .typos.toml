[default.extend-words]
# Citation key prefix for Bao et al. 2025 (@ba2025)
ba = "ba"
Ba = "Ba"

# Journal shorthand in research notes; PN appears inside PNGs in handoffs
Commun = "Commun"
PN = "PN"

# Bibliography entries and publisher templates contain arbitrary tokens;
# draft .tex is generated from manuscript.md; perplex/ ships thermodynamic
# datasets with mineral abbreviations
[files]
extend-exclude = ["*.bib", "*.cls", "*.sty", "draft/**/*.tex", "draft/bak/**", "perplex/**"]
